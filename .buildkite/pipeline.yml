agents:
  queue: "${MAESTRO_CI_QUEUE:-hetzner-linux-medium}"
  image: "${MAESTRO_CI_IMAGE:-evalops-platform-ci-v3}"

env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TARGET_DIR: ".buildkite/cache/cargo-target"
  npm_config_cache: ".buildkite/cache/npm"
  npm_config_fetch_retries: "1"
  npm_config_fetch_timeout: "30000"

steps:
  - group: ":rust: Native validation"
    if: build.env("MAESTRO_CI_SUPPLY_CHAIN_ONLY") != "true"
    steps:
      - label: ":lint-roller: Contracts, format, and Clippy"
        key: "lint"
        priority: 50
        timeout_in_minutes: 90
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        cache:
          name: "maestro-lint-${BUILDKITE_PULL_REQUEST}"
          size: "50g"
          paths: [".buildkite/cache"]
        command: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m npm ci --ignore-scripts
          timeout --signal=TERM --kill-after=30s 45m npm run check
          node --test scripts/check-doc-paths.test.mjs scripts/version.test.mjs
          if [[ -f scripts/measure-ci-build-latency.test.mjs ]]; then
            node --test scripts/measure-ci-build-latency.test.mjs
          fi
          if [[ -d test/internal ]]; then
            npm run test:internal
          fi
          timeout --signal=TERM --kill-after=30s 30m npm run lint
          node --test scripts/check-advisory-expiry.test.mjs
          node scripts/check-advisory-expiry.mjs

      - label: ":test_tube: Full Rust workspace"
        key: "rust-tests"
        priority: 50
        timeout_in_minutes: 90
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        agents:
          queue: "${MAESTRO_CI_QUEUE:-hetzner-linux-medium}"
          image: "${MAESTRO_CI_IMAGE:-evalops-platform-ci-v3}"
        cache:
          name: "maestro-tests-${BUILDKITE_PULL_REQUEST}"
          size: "50g"
          paths: [".buildkite/cache"]
        command: |
          set -euo pipefail
          export MAESTRO_TRUSTED_RUNNER_WORKSPACE_ROOTS="$$(pwd -P)"
          maestro_test_home="$$(mktemp -d)"
          export MAESTRO_HOME="$$maestro_test_home"
          export MAESTRO_SUBAGENTS_DIR="$$maestro_test_home/subagents"
          nextest_version="0.9.143"
          nextest_archive="$$(mktemp)"
          nextest_dir="$$(mktemp -d)"
          trap 'rm -rf "$$maestro_test_home"; rm -f "$$nextest_archive"; rm -rf "$$nextest_dir"' EXIT
          timeout --signal=TERM --kill-after=10s 2m curl --fail --location --silent --show-error \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$$nextest_version/cargo-nextest-$$nextest_version-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$$nextest_archive"
          printf '%s  %s\n' \
            66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e \
            "$$nextest_archive" | sha256sum --check --status
          tar -C "$$nextest_dir" -xzf "$$nextest_archive"
          export PATH="$$nextest_dir:$$PATH"
          timeout --signal=TERM --kill-after=30s 45m cargo nextest run --profile buildkite --workspace --locked --no-fail-fast
          timeout --signal=TERM --kill-after=30s 20m cargo test --workspace --locked --doc
          export MAESTRO_TUI_BIN="$$CARGO_TARGET_DIR/debug/maestro-tui"
          test -x "$$MAESTRO_TUI_BIN" || timeout --signal=TERM --kill-after=30s 30m cargo build --locked -p maestro-tui
          npm run smoke:tui

      - label: ":package: Native build and conformance"
        key: "native-release"
        priority: 50
        timeout_in_minutes: 90
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        agents:
          queue: "${MAESTRO_CI_QUEUE:-hetzner-linux-medium}"
          image: "${MAESTRO_CI_IMAGE:-evalops-platform-ci-v3}"
        cache:
          name: "maestro-release-${BUILDKITE_PULL_REQUEST}"
          size: "50g"
          paths: [".buildkite/cache"]
        command: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m npm ci --ignore-scripts
          timeout --signal=TERM --kill-after=30s 45m npm run build
          npm run smoke:release-native-only
          node scripts/run-runtime-conformance.mjs --binary "$$CARGO_TARGET_DIR/fast-validation/maestro"

  - group: ":repeat: Integration and replay"
    if: build.env("MAESTRO_CI_SUPPLY_CHAIN_ONLY") != "true"
    steps:
      - label: ":docker: Control-plane integration"
        key: "integration"
        priority: 50
        timeout_in_minutes: 60
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        agents:
          queue: "${MAESTRO_CI_QUEUE:-hetzner-linux-medium}"
          image: "${MAESTRO_CI_IMAGE:-evalops-platform-ci-v3}"
        cache:
          name: "maestro-integration-${BUILDKITE_PULL_REQUEST}"
          size: "50g"
          paths: [".buildkite/cache"]
        command: |
          set -euo pipefail
          suffix="$${BUILDKITE_JOB_ID//-/}"
          redis="maestro-redis-$$suffix"
          postgres="maestro-postgres-$$suffix"
          trap 'docker rm -f "$$redis" "$$postgres" >/dev/null 2>&1 || true' EXIT
          redis_image="mirror.gcr.io/library/redis:7-alpine"
          postgres_image="mirror.gcr.io/library/postgres:16-alpine"
          timeout --signal=TERM --kill-after=10s 2m docker pull "$$redis_image"
          timeout --signal=TERM --kill-after=10s 2m docker pull "$$postgres_image"
          docker run -d --rm --name "$$redis" -p 127.0.0.1::6379 "$$redis_image"
          docker run -d --rm --name "$$postgres" -e POSTGRES_USER=maestro -e POSTGRES_PASSWORD=maestro -e POSTGRES_DB=maestro -p 127.0.0.1::5432 "$$postgres_image"
          redis_port="$$(docker port "$$redis" 6379/tcp | sed 's/.*://')"
          postgres_port="$$(docker port "$$postgres" 5432/tcp | sed 's/.*://')"
          for _ in $$(seq 1 60); do docker exec "$$postgres" pg_isready -U maestro >/dev/null 2>&1 && break; sleep 2; done
          MAESTRO_REDIS_URL="redis://127.0.0.1:$$redis_port" \
            MAESTRO_DATABASE_URL="postgresql://maestro:maestro@127.0.0.1:$$postgres_port/maestro" \
            PGPASSWORD=maestro timeout --signal=TERM --kill-after=30s 30m cargo test --locked -p maestro-runtime-gateway
          POSTGRES_DB=maestro \
            POSTGRES_HOST=127.0.0.1 \
            POSTGRES_PASSWORD=maestro \
            POSTGRES_PORT="$$postgres_port" \
            POSTGRES_USER=maestro \
            PGPASSWORD=maestro \
            timeout --signal=TERM --kill-after=30s 30m cargo test --locked -p maestro-tui --test tools_integration

      - label: ":repeat: Deterministic scenario replay"
        key: "scenario-replay"
        priority: 50
        timeout_in_minutes: 45
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        cache:
          name: "maestro-replay-${BUILDKITE_PULL_REQUEST}"
          size: "30g"
          paths: [".buildkite/cache"]
        command: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m npm ci --ignore-scripts
          timeout --signal=TERM --kill-after=30s 30m cargo build --locked -p maestro-scenario
          node --test scripts/scenario-replay-governance.test.mjs
          MAESTRO_BIN="$$CARGO_TARGET_DIR/debug/maestro-scenario" npm run check:scenario-replay-gate -- --junit-dir tmp/scenario-replay

  - label: ":pipeline: CI configuration contracts"
    key: "ci-contracts"
    priority: 50
    if: build.env("MAESTRO_CI_SUPPLY_CHAIN_ONLY") != "true"
    timeout_in_minutes: 30
    concurrency: 3
    concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
    retry:
      automatic:
        - exit_status: -1
          signal_reason: none
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    cache:
      name: "maestro-ci-contracts-${BUILDKITE_PULL_REQUEST}"
      size: "20g"
      paths: [".buildkite/cache"]
    command: |
      set -euo pipefail
      timeout --signal=TERM --kill-after=10s 5m npm ci --ignore-scripts
      test ! -d src/hooks
      node --test scripts/check-buildkite-pipeline.test.mjs
      node scripts/check-rust-only-runtime.mjs
      node scripts/check-hook-dispatch-coverage.mjs
      if [[ -f scripts/workflow-contracts.test.mjs ]]; then
        node --test scripts/workflow-contracts.test.mjs
      fi

  - group: ":shield: Auxiliary validation"
    steps:
      - label: ":github: Workflow and shell tooling"
        key: "workflow-tooling"
        priority: 50
        if: build.env("MAESTRO_CI_SUPPLY_CHAIN_ONLY") != "true"
        timeout_in_minutes: 30
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        cache:
          name: "maestro-ci-tools-${BUILDKITE_PULL_REQUEST}"
          size: "20g"
          paths: [".buildkite/cache"]
        command: scripts/run-buildkite-ci-tooling.sh

      - label: ":lock: Supply chain"
        key: "supply-chain"
        priority: 50
        timeout_in_minutes: 45
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_CONCURRENCY_GROUP:-maestro-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        cache:
          name: "maestro-supply-chain-${BUILDKITE_PULL_REQUEST}"
          size: "20g"
          paths: [".buildkite/cache"]
        command: scripts/run-buildkite-supply-chain.sh

      - label: ":idea: JetBrains plugin"
        key: "jetbrains-plugin"
        priority: 50
        agents:
          queue: "${MAESTRO_CI_JETBRAINS_QUEUE:-hetzner-linux-heavy}"
          image: "${MAESTRO_CI_JETBRAINS_IMAGE:-evalops-platform-ci-v3}"
        if: build.env("MAESTRO_CI_SUPPLY_CHAIN_ONLY") != "true"
        timeout_in_minutes: 45
        concurrency: 3
        concurrency_group: "${MAESTRO_CI_JETBRAINS_CONCURRENCY_GROUP:-maestro-jetbrains-heavy-workloads}"
        retry:
          automatic:
            - exit_status: -1
              signal_reason: none
              limit: 1
            - exit_status: 137
              limit: 1
            - signal_reason: agent_stop
              limit: 1
        cache:
          name: "maestro-jetbrains-${BUILDKITE_PULL_REQUEST}"
          size: "20g"
          paths: [".buildkite/cache"]
        command: scripts/run-buildkite-jetbrains.sh

      # Do not list coverage/perf here. A step with `if:` is still created
      # and shows as broken on push and PR. Upload them only on the daily
      # 05:17 UTC schedule (BUILDKITE_SOURCE=schedule).
      - label: ":pipeline: Upload scheduled advisory steps"
        key: "advisory-upload"
        priority: 60
        timeout_in_minutes: 5
        soft_fail: true
        command: |
          set -euo pipefail
          if [[ "$${BUILDKITE_BRANCH}" == "main" && "$${BUILDKITE_SOURCE}" == "schedule" && -f .buildkite/advisory.yml ]]; then
            buildkite-agent pipeline upload .buildkite/advisory.yml
          fi
