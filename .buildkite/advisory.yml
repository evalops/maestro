# Uploaded only by the advisory-upload step when
# BUILDKITE_BRANCH=main and BUILDKITE_SOURCE=schedule.
# Do not add this file to the default pipeline.yml: a step with
# `if:` still appears as broken on push and PR builds.
# A separately uploaded pipeline does not inherit agents/env from
# pipeline.yml. Repeat those blocks here.

agents:
  queue: "${MAESTRO_CI_QUEUE:-linux-large}"
  image: "${MAESTRO_CI_IMAGE:-evalops-platform-ci-v6}"

env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  CARGO_TARGET_DIR: ".buildkite/cache/cargo-target"
  npm_config_cache: ".buildkite/cache/npm"
  npm_config_fetch_retries: "1"
  npm_config_fetch_timeout: "30000"

steps:
  - label: ":orb: Hosted Orb delegation acceptance (required when gated)"
    key: "hosted-orb-delegation-live"
    priority: 10
    timeout_in_minutes: 30
    agents:
      queue: "${MAESTRO_CI_PROTOCOL_QUEUE:-linux-medium}"
      image: "${MAESTRO_CI_PROTOCOL_IMAGE:-evalops-platform-ci-v6}"
    command: |
      set -euo pipefail
      timeout --signal=TERM --kill-after=10s 5m npm ci --ignore-scripts
      if [[ "${MAESTRO_HOSTED_ORB_LIVE_SMOKE:-}" != "1" ]]; then
        echo "Optional hosted Orb acceptance was not requested; skipping."
        exit 0
      fi
      npm run smoke:hosted-orb-delegation

  - label: ":bar_chart: Coverage (advisory)"
    key: "coverage"
    priority: 10
    soft_fail: true
    timeout_in_minutes: 90
    concurrency: 1
    concurrency_group: "${MAESTRO_CI_ADVISORY_CONCURRENCY_GROUP:-maestro-advisory-workloads}"
    retry:
      automatic:
        - exit_status: -1
          signal_reason: none
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    cache:
      name: "maestro-coverage-main"
      size: "50g"
      paths: [".buildkite/cache"]
    command: scripts/run-buildkite-coverage.sh

  - label: ":stopwatch: Performance baseline (advisory)"
    key: "perf-baseline"
    priority: 10
    soft_fail: true
    timeout_in_minutes: 60
    concurrency: 1
    concurrency_group: "${MAESTRO_CI_ADVISORY_CONCURRENCY_GROUP:-maestro-advisory-workloads}"
    retry:
      automatic:
        - exit_status: -1
          signal_reason: none
          limit: 1
        - signal_reason: agent_stop
          limit: 1
    cache:
      name: "maestro-perf-main"
      size: "30g"
      paths: [".buildkite/cache"]
    command: scripts/run-buildkite-perf.sh
