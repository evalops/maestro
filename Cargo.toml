[workspace]
resolver = "2"
members = [
    "packages/maestro-rs",
    "packages/ai-rs",
    "packages/control-plane-rs",
    "packages/execpolicy-rs",
    "packages/tui-rs",
    "packages/ambient-agent-rs",
]

[workspace.dependencies]
anyhow = "1"
aws-config = { version = "1.10.1", default-features = false, features = [
    "behavior-version-latest",
    "credentials-process",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-credential-types = "1.3.0"
aws-sdk-bedrockruntime = { version = "1.139.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = "1.6.1"
aws-types = "1.5.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctor = "0.6.3"
dirs = "6"
dunce = "1"
eventsource-stream = "0.2"
fd-lock = "4"
futures = "0.3"
glob = "0.3"
libc = "0.2"
maestro-ai = { path = "packages/ai-rs" }
maestro-control-plane = { path = "packages/control-plane-rs" }
maestro-execpolicy = { path = "packages/execpolicy-rs" }
maestro-tui = { path = "packages/tui-rs" }
# Shared by maestro-tui and maestro-control-plane; keep both crates on the
# same version here so a security bump (e.g. the lopdf RUSTSEC-2026-0187
# fix) can't land in one crate's Cargo.toml and silently miss the other.
pdf-extract = "0.12"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1" }
tokio-stream = "0.1"
tokio-rustls = "0.26"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wait-timeout = "0.2"
x509-parser = "0.18"
zip = "8"
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"

# Keep local release builds quick enough for iteration while still enabling
# cross-crate optimization for the distributed binary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Distribution profile for shipped binaries (adopted from grok-build).
# Deliberately separate from `release`: local `--release` builds stay stripped
# and quick, while CI ships `release-dist` artifacts. Thin LTO and
# codegen-units = 1 match `release`'s whole-program optimization; debug = 1
# emits line-table DWARF and strip = false keeps symbols so CI can extract
# debug sidecars (.debug on Linux, .dSYM on macOS) before stripping
# post-build. Alpha/beta and stable promotion can reuse the same
# release-dist binary — promotion is a re-tag, not a rebuild.
[profile.release-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = false
debug = 1

# Line tables preserve useful backtraces without the multi-gigabyte full debug
# information duplicated by the former independent Cargo roots. incremental
# (already Cargo's dev default, spelled out explicitly) and a capped
# codegen-unit count keep the edit-build cycle fast.
[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 128

[profile.test]
debug = "line-tables-only"

# magic-trace needs symbols and frame pointers. Build with:
#   RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile magic-trace -p maestro-tui
[profile.magic-trace]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16
