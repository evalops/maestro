[package]
name = "maestro-control-plane"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust HTTP control plane for Maestro"

[[bin]]
name = "maestro-control-plane"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dunce.workspace = true
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
getrandom = "0.4"
libc.workspace = true
maestro-tui.workspace = true
pdf-extract.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.11"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "fs"] }
tokio-util = "0.7"
zip.workspace = true
