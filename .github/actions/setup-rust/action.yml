name: Setup Rust
description: Install Rust toolchain and restore Cargo caches.

inputs:
  toolchain:
    description: Rust toolchain to install (e.g. stable, nightly, 1.89.0)
    required: false
    default: stable
  components:
    description: Comma-separated components to install (e.g. rustfmt, clippy)
    required: false
    default: ""
  targets:
    description: Comma-separated targets to install (e.g. wasm32-unknown-unknown)
    required: false
    default: ""
  workspaces:
    description: Rust-cache workspaces (newline-separated "$workspace -> $target")
    required: false
    default: ". -> target"
  install-cargo-llvm-cov:
    description: Whether to install cargo-llvm-cov (prebuilt)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure isolated Rust toolchain home
      shell: bash
      env:
        TOOLCHAIN_INPUT: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        safe_repo="${GITHUB_REPOSITORY:-repo}"
        safe_repo="${safe_repo//[^A-Za-z0-9_.-]/-}"
        safe_job="${GITHUB_JOB:-job}"
        safe_job="${safe_job//[^A-Za-z0-9_.-]/-}"
        safe_toolchain="${TOOLCHAIN_INPUT:-stable}"
        safe_toolchain="${safe_toolchain//[^A-Za-z0-9_.-]/-}"
        root="${RUNNER_TEMP:-${GITHUB_WORKSPACE:-$PWD}/.tmp}/maestro-rust/${safe_repo}/${safe_job}/${safe_toolchain}"
        cargo_home="$root/cargo"
        rustup_home="$root/rustup"
        mkdir -p "$cargo_home/bin" "$rustup_home"

        export CARGO_HOME="$cargo_home"
        export RUSTUP_HOME="$rustup_home"
        export PATH="$cargo_home/bin:$PATH"

        if ! command -v rustup >/dev/null 2>&1; then
          echo "No rustup binary found before toolchain setup; rust-toolchain action will install one."
        elif [[ "$(command -v rustup)" != "$cargo_home/bin/rustup" ]]; then
          cp "$(command -v rustup)" "$cargo_home/bin/rustup"
          chmod +x "$cargo_home/bin/rustup"
        fi

        echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"

    - name: Install Rust toolchain (toolchain only)
      if: ${{ inputs.components == '' && inputs.targets == '' }}
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Install Rust toolchain (toolchain + components)
      if: ${{ inputs.components != '' && inputs.targets == '' }}
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install Rust toolchain (toolchain + targets)
      if: ${{ inputs.components == '' && inputs.targets != '' }}
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}

    - name: Install Rust toolchain (toolchain + components + targets)
      if: ${{ inputs.components != '' && inputs.targets != '' }}
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Ensure Rustup tool proxies
      shell: bash
      run: |
        set -euo pipefail
        cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        rustup_bin="$cargo_bin/rustup"
        if [ ! -x "$rustup_bin" ]; then
          rustup_bin="$(command -v rustup || true)"
        fi
        if [ -z "$rustup_bin" ] || [ ! -x "$rustup_bin" ]; then
          echo "::error::rustup is required to create Cargo tool proxies"
          exit 1
        fi

        mkdir -p "$cargo_bin"
        for proxy in cargo rustc rustdoc rustfmt cargo-fmt cargo-clippy clippy-driver; do
          if [ ! -x "$cargo_bin/$proxy" ]; then
            ln -sf "$rustup_bin" "$cargo_bin/$proxy"
          fi
        done
        "$cargo_bin/cargo" --version

    - name: Cache Cargo
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      with:
        workspaces: ${{ inputs.workspaces }}

    - name: Install cargo-llvm-cov
      if: ${{ inputs.install-cargo-llvm-cov == 'true' }}
      uses: taiki-e/install-action@d850aa816998e5cf15f67a78c7b933f2a5033f8a # v2.63.3
      with:
        tool: cargo-llvm-cov
