name: Setup Bun + Nx
description: Setup Bun, restore Bun/Nx caches, and optionally install dependencies.

inputs:
  node-version-file:
    description: Path to a Node version file (e.g. .node-version)
    required: false
    default: ".node-version"
  node-version:
    description: Node.js version to install (used only if node-version-file is empty)
    required: false
    default: ""
  bun-version:
    description: Bun version to install
    required: false
    default: "1.3.6"
  install:
    description: Whether to run bun install
    required: false
    default: "true"
  cache-bun:
    description: Whether to enable Bun cache
    required: false
    default: "true"
  cache-nx:
    description: Whether to enable Nx cache
    required: false
    default: "true"
  ensure-ripgrep:
    description: Whether to install ripgrep if missing
    required: false
    default: "false"
  ensure-rustfmt:
    description: Whether to install rustfmt before bun install/codegen.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup Node (from version file)
      if: ${{ inputs.node-version-file != '' }}
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Setup Node (from explicit version)
      if: ${{ inputs.node-version-file == '' }}
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun
      if: ${{ inputs.cache-bun == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: ${{ runner.os }}-bun-v2-${{ inputs.bun-version }}-${{ hashFiles('bun.lockb') }}

    - name: Cache Nx
      if: ${{ inputs.cache-nx == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ hashFiles('bun.lockb', 'nx.json', 'project.json', 'packages/**/project.json') }}
        restore-keys: |
          ${{ runner.os }}-nx-

    - name: Ensure ripgrep
      if: ${{ inputs.ensure-ripgrep == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
        fi

    - name: Ensure rustfmt
      if: ${{ inputs.ensure-rustfmt == 'true' && inputs.install == 'true' }}
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: stable
        components: rustfmt

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        bun_cache_dir="${RUNNER_TEMP:-$GITHUB_WORKSPACE/.tmp}/bun-install-cache"
        mkdir -p "${bun_cache_dir}"
        for attempt in 1 2 3; do
          if bun install --cache-dir "${bun_cache_dir}" --frozen-lockfile; then
            exit 0
          fi
          if [[ "$attempt" -eq 3 ]]; then
            exit 1
          fi
          echo "bun install failed on attempt ${attempt}; clearing Bun download cache before retry."
          rm -rf "${bun_cache_dir}"
          mkdir -p "${bun_cache_dir}"
          sleep $((attempt * 5))
        done
