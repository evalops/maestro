name: version-bump

on:
  schedule:
    # Weekly Monday patch release proposal at 09:00 Pacific during daylight time.
    - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver bump to prepare"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      base_ref:
        description: "Base branch to cut the release PR from"
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.base_ref || 'main' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_BASE_REF: ${{ github.event.inputs.base_ref || 'main' }}
  RELEASE_BUMP_TYPE: ${{ github.event.inputs.bump_type || 'patch' }}

jobs:
  version-bump:
    if: ${{ github.event_name != 'schedule' || github.repository == 'evalops/maestro-internal' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_BASE_REF }}

      - uses: ./.github/actions/setup-bun-nx

      - name: Summarize release cadence
        run: |
          {
            echo "## Release cadence"
            echo
            echo "- mode: \`${{ github.event_name == 'schedule' && 'weekly scheduled patch' || 'manual dispatch' }}\`"
            echo "- base ref: \`${RELEASE_BASE_REF}\`"
            echo "- bump type: \`${RELEASE_BUMP_TYPE}\`"
            echo "- public schedule runs are intentionally skipped; internal main remains the source of truth"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - id: version
        run: |
          set -euo pipefail
          release_version="$(node scripts/version.js next "$RELEASE_BUMP_TYPE")"
          {
            echo "release_version=$release_version"
            echo "branch=release/v${release_version}"
          } >> "$GITHUB_OUTPUT"

      - id: branch
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare versioned files
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          BRANCH_EXISTS: ${{ steps.branch.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH_EXISTS" == "true" ]]; then
            git fetch origin \
              "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
              "${RELEASE_BASE_REF}:refs/remotes/origin/${RELEASE_BASE_REF}"
            git switch -C "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git branch --set-upstream-to="origin/$RELEASE_BRANCH" "$RELEASE_BRANCH"
            git merge --no-edit "origin/${RELEASE_BASE_REF}"
            node scripts/version.js set "$RELEASE_VERSION" --release-notes-ref "origin/${RELEASE_BASE_REF}"
          else
            npm run "version:${RELEASE_BUMP_TYPE}"
            git switch -c "$RELEASE_BRANCH"
          fi

      - id: release
        uses: ./.github/actions/release-context
        with:
          requested-version: ${{ steps.version.outputs.release_version }}

      - name: Commit release branch
        id: commit
        env:
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          BRANCH_EXISTS: ${{ steps.branch.outputs.exists }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            if [[ "$BRANCH_EXISTS" == "true" ]] && [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$RELEASE_BRANCH")" ]]; then
              git push origin "$RELEASE_BRANCH"
              echo "Release branch $RELEASE_BRANCH advanced to current $RELEASE_BASE_REF."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release branch $RELEASE_BRANCH already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .
          git commit -m "Release v${RELEASE_VERSION}"
          if [[ "$BRANCH_EXISTS" == "true" ]]; then
            git push origin "$RELEASE_BRANCH"
          else
            git push --set-upstream origin "$RELEASE_BRANCH"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Extract generated changelog entry
        id: changelog
        run: |
          set -euo pipefail
          changelog_path="$RUNNER_TEMP/release-changelog.md"
          node scripts/release-notes.js latest-entry \
            --version "${{ steps.release.outputs.release_version }}" \
            > "$changelog_path"
          echo "path=$changelog_path" >> "$GITHUB_OUTPUT"

      - name: Open or reuse release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ env.RELEASE_BASE_REF }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_BUMP_TYPE: ${{ env.RELEASE_BUMP_TYPE }}
          CHANGELOG_PATH: ${{ steps.changelog.outputs.path }}
        run: |
          set -euo pipefail
          changelog_entry="$(cat "$CHANGELOG_PATH")"
          pr_body=$(cat <<EOF
          ## Summary

          - prepare release v${RELEASE_VERSION}
          - run the ${RELEASE_BUMP_TYPE} release cadence from ${BASE_REF}
          - update generated metadata, package versions, and CHANGELOG.md

          ## Changelog

          ${changelog_entry}

          ## Validation

          - Generated by the \`version-bump\` workflow
          - Changelog generated from commits since the latest reachable semver tag
          EOF
          )

          existing_pr_number=$(gh pr list \
            --base "$BASE_REF" \
            --head "$RELEASE_BRANCH" \
            --json number \
            --jq '.[0].number // ""')

          if [[ -n "$existing_pr_number" ]]; then
            gh pr edit "$existing_pr_number" \
              --title "Release v${RELEASE_VERSION}" \
              --body "$pr_body"
            existing_pr_url=$(gh pr view "$existing_pr_number" --json url --jq '.url')
            echo "Release PR already exists and was updated: $existing_pr_url"
            exit 0
          fi

          gh pr create \
            --base "$BASE_REF" \
            --head "$RELEASE_BRANCH" \
            --title "Release v${RELEASE_VERSION}" \
            --body "$pr_body"
