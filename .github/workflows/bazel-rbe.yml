name: Bazel RBE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .bazelignore
      - .bazelrc
      - .bazelversion
      - .github/actions/setup-bun-nx/action.yml
      - .github/workflows/bazel-rbe.yml
      - .node-version
      - BUILD.bazel
      - MODULE.bazel
      - MODULE.bazel.lock
      - Makefile
      - bun.lockb
      - docs/development/bazel.md
      - nx.json
      - package.json
      - packages/**/package.json
      - packages/**/project.json
      - project.json
      - scripts/run-bazel-rbe.sh
      - tool-versions.json
      - tools/bazel/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    # timeout-minutes only applies after a runner is assigned. A push job that
    # targets a self-hosted label with zero online runners sits in queue for up
    # to GitHub's 24h default and then cancels as a red/cancelled main check.
    # Require an explicit readiness flag in addition to BAZEL_RBE_ENABLED so a
    # missing RBE pool cannot brick default-branch CI. Manual workflow_dispatch
    # remains available for intentional smoke runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (vars.BAZEL_RBE_ENABLED == 'true' && vars.BAZEL_RBE_RUNNER_READY == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - evalops-maestro-rbe
    timeout-minutes: 20
    env:
      BAZEL_RBE_USE_EXISTING_TUNNEL: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
          cache: false

      - name: Install Bazel tools
        env:
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          go install github.com/bazelbuild/bazelisk@latest
          go install github.com/bazelbuild/buildtools/buildifier@latest

      - name: Verify Bazel graph
        run: make bazel-check

      - name: Run Buildfarm smoke test
        run: make bazel-rbe-smoke
