name: GHCR Publish

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ghcr-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/evalops/maestro

jobs:
  build-and-publish:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (github.event_name == 'pull_request' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest')) }}
    # Internal main-push image builds can take longer than the public mirror on
    # the private runner because the Rust control-plane layer compiles there.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Publish is push-only
        if: github.event_name == 'pull_request'
        run: echo "GHCR publish runs only on main pushes; this PR check satisfies the required status without building an image."

      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch deploy GitOps image sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_IMAGE_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "error: RUNTIME_IMAGE_SYNC_TOKEN is required to dispatch evalops/deploy image sync." >&2
            exit 1
          fi

          image_tag="sha-${SOURCE_SHA:0:7}"
          gh api \
            --method POST \
            repos/evalops/deploy/dispatches \
            -f event_type=maestro_runtime_image_published \
            -f "client_payload[source_sha]=${SOURCE_SHA}" \
            -f "client_payload[image_tag]=${image_tag}"
