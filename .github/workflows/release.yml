name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semver (with or without leading v)
        required: true

permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-15 }
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          workspaces: . -> target
      - name: Build canonical native binary
        run: node scripts/build-release-binary.mjs --platform "${{ matrix.platform }}"
      - name: Smoke host binary
        if: ${{ matrix.platform == 'linux-x64' }}
        run: node scripts/smoke-release-native-only.mjs "dist/release/maestro-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ matrix.platform }}
          path: dist/release/maestro-${{ matrix.platform }}

  publish:
    needs: binaries
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v4
        with:
          pattern: maestro-*
          path: release-binaries
          merge-multiple: true
      - name: Resolve release version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version || github.ref_name }}
        run: echo "value=${REQUESTED#v}" >> "$GITHUB_OUTPUT"
      - name: Verify native package inputs
        run: |
          test "$(node -p "require('./package.json').version")" = "${{ steps.version.outputs.value }}"
          test -f packages/web/dist/index.html
          npm run check:rust-only-runtime
      - name: Materialize native npm package
        run: node scripts/materialize-native-package.mjs --input-dir release-binaries
      - name: Package browser assets for native installs
        run: tar -czf maestro-web-dist.tar.gz -C packages/web/dist .
      - id: pack
        run: |
          PACK_JSON=$(npm pack --json)
          echo "$PACK_JSON"
          echo "tarball=$(echo "$PACK_JSON" | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"
      - name: Smoke packed package without JS runtime
        run: node scripts/smoke-release-native-only.mjs bin/maestro
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Maestro ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            release-binaries/maestro-darwin-arm64
            release-binaries/maestro-darwin-x64
            release-binaries/maestro-linux-x64
            release-binaries/maestro-linux-arm64
            maestro-web-dist.tar.gz
