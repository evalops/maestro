name: tag-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag-current-version:
    runs-on: ${{ github.repository == 'evalops/maestro-internal' && (vars.INTERNAL_CONFIRMATION_RUNNER || 'evalops-internal') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      active_release_count: ${{ steps.active-release.outputs.active_count }}
      package_name: ${{ steps.release.outputs.package_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
      registry_published: ${{ steps.registry-release.outputs.published }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - id: release
        uses: ./.github/actions/release-context
        with:
          fallback-to-package-version: "true"
          create-tag-if-missing: "true"

      - id: registry-release
        name: Check npm registry release
        if: ${{ github.repository == 'evalops/maestro' }}
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          published_version="$(npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version 2>/dev/null || true)"
          if [[ "${published_version}" == "${RELEASE_VERSION}" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} is published on npm."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} is not published on npm yet."
          fi


      - id: active-release
        name: Check active public release workflow
        if: ${{ github.repository == 'evalops/maestro' && steps.registry-release.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          active_count="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow release \
              --json headBranch,status \
              --limit 50 \
              --jq "[.[] | select(.headBranch == \"${RELEASE_TAG}\" and .status != \"completed\")] | length"
          )"
          echo "active_count=${active_count}" >> "$GITHUB_OUTPUT"
          if [[ "${active_count}" == "0" ]]; then
            echo "No active release workflow exists for ${RELEASE_TAG}."
          else
            echo "Found ${active_count} active release workflow run(s) for ${RELEASE_TAG}; not dispatching another."
          fi

      - name: Require version bump for existing release tag
        if: ${{ github.repository == 'evalops/maestro' && steps.release.outputs.tag_exists == 'true' && steps.release.outputs.tag_matches_head != 'true' && steps.release.outputs.package_changed_since_tag == 'true' && steps.registry-release.outputs.published != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAG_TARGET: ${{ steps.release.outputs.tag_target }}
        run: |
          echo "::error title=Package version already tagged::package.json version ${RELEASE_VERSION} already has a semver tag at another commit."
          echo "package.json version ${RELEASE_VERSION} already has a semver tag at another commit." >&2
          echo "${RELEASE_TAG} points at ${TAG_TARGET}; current HEAD is ${GITHUB_SHA}." >&2
          echo "Bump package.json before tagging another main commit for this package version." >&2
          exit 1

      - name: Summarize tag status
        run: |
          if [[ "${{ steps.release.outputs.tag_exists }}" == "true" && "${{ steps.release.outputs.tag_matches_head }}" == "true" ]]; then
            echo "Semver tag ${{ steps.release.outputs.release_tag }} already exists at this commit."
          elif [[ "${{ steps.release.outputs.tag_exists }}" == "true" && "${{ steps.release.outputs.package_changed_since_tag }}" == "true" && "${{ steps.registry-release.outputs.published }}" == "true" ]]; then
            echo "Semver tag ${{ steps.release.outputs.release_tag }} already exists at another commit."
            echo "${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.release_version }} is already published on npm; no new release dispatch is needed."
          elif [[ "${{ steps.release.outputs.tag_exists }}" == "true" && "${{ steps.release.outputs.package_changed_since_tag }}" == "true" ]]; then
            echo "Semver tag ${{ steps.release.outputs.release_tag }} already exists at another commit."
            echo "Package-impacting source inputs changed since the existing tag."
          elif [[ "${{ steps.release.outputs.tag_exists }}" == "true" ]]; then
            echo "Semver tag ${{ steps.release.outputs.release_tag }} already exists."
            echo "No package-impacting source inputs changed since the existing tag."
          else
            echo "Created semver tag ${{ steps.release.outputs.release_tag }}."
          fi

  verify-published-registry-package:
    needs: tag-current-version
    if: ${{ github.repository == 'evalops/maestro' && needs.tag-current-version.outputs.registry_published == 'true' }}
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup registry install smoke tools
        uses: ./.github/actions/setup-bun-nx
        with:
          install: "false"
          cache-nx: "false"
          ensure-rustfmt: "false"

      - name: Verify already-published package from registry
        env:
          PACKAGE_NAME: ${{ needs.tag-current-version.outputs.package_name }}
          RELEASE_VERSION: ${{ needs.tag-current-version.outputs.release_version }}
          MAESTRO_INSTALL_AUDIT_LEVEL: critical
          MAESTRO_PUBLISHED_REPLAY_SANDBOX_MODE: local
          MAESTRO_REGISTRY_SMOKE_EVIDENCE_DIR: tag-release-published-replay-evidence
          MAESTRO_REGISTRY_POLL_ATTEMPTS: "1"
          MAESTRO_REGISTRY_POLL_DELAY_MS: "1000"
        run: |
          set -euo pipefail
          cli_command="$(node -p 'Object.keys(require("./package.json").bin)[0]')"
          node scripts/smoke-registry-install.js \
            --package "$PACKAGE_NAME" \
            --version "$RELEASE_VERSION" \
            --cli-command "$cli_command"
          node scripts/verify-published-replay-evidence.js --evidence-dir tag-release-published-replay-evidence

      - name: Upload already-published replay evidence
        if: ${{ always() && hashFiles('tag-release-published-replay-evidence/*.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: tag-release-published-replay-evidence-${{ needs.tag-current-version.outputs.release_tag }}
          path: tag-release-published-replay-evidence/*.json

  dispatch-public-release:
    needs:
      - tag-current-version
      - verify-published-registry-package
    if: ${{ always() && github.repository == 'evalops/maestro' && needs.tag-current-version.result == 'success' && (needs.tag-current-version.outputs.registry_published != 'true' || needs.verify-published-registry-package.result == 'success') && (needs.tag-current-version.outputs.tag_exists != 'true' || needs.tag-current-version.outputs.registry_published != 'true') && (needs.tag-current-version.outputs.active_release_count == '0' || needs.tag-current-version.outputs.active_release_count == '') }}
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch public release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag-current-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.tag-current-version.outputs.release_version }}
        run: |
          set -euo pipefail
          active_count="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow release \
              --json headBranch,status \
              --limit 50 \
              --jq "[.[] | select(.headBranch == \"${RELEASE_TAG}\" and .status != \"completed\")] | length"
          )"
          if [[ "${active_count}" != "0" ]]; then
            echo "Found ${active_count} active release workflow run(s) for ${RELEASE_TAG}; not dispatching another."
            exit 0
          fi
          dispatch_status=0
          dispatch_started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gh workflow run release --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_TAG}" --field "version=${RELEASE_VERSION}" || dispatch_status=$?
          for attempt in 1 2 3 4 5 6; do
            release_run_count="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow release \
                --json createdAt,headBranch,status \
                --limit 50 \
                --jq "[.[] | select(.headBranch == \"${RELEASE_TAG}\" and .createdAt >= \"${dispatch_started_at}\")] | length"
            )"
            if [[ "${release_run_count}" != "0" ]]; then
              echo "Confirmed ${release_run_count} new release workflow run(s) for ${RELEASE_TAG}."
              exit 0
            fi
            sleep 5
          done
          if [[ "${dispatch_status}" != "0" ]]; then
            echo "release workflow dispatch failed and no release run appeared for ${RELEASE_TAG}." >&2
            exit "${dispatch_status}"
          fi
          echo "release workflow dispatch succeeded but no release run appeared for ${RELEASE_TAG}." >&2
          exit 1
