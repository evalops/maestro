name: evals

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/*.md"
      - "docs/**/*.md"
      - "examples/**/README.md"
      - "packages/**/README.md"
      - "src/**/README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "todo.md"
      - "LICENSE*"
      - ".github/PUBLIC_TREE_MIRROR_BOUNDARY.md"
      - ".github/RELEASE_MIRROR_CONTRACT.md"
  pull_request:
    types: [opened, reopened, ready_for_review, labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-pr-evals:
    runs-on: ${{ github.repository == 'evalops/maestro-internal' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') }}
    outputs:
      should_run: ${{ steps.detect.outputs.result }}
    steps:
      - id: detect
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          result-encoding: string
          script: |
            if (context.eventName !== "pull_request") {
              core.info(`Non-PR event (${context.eventName}); running evals.`);
              return "true";
            }

            const pull = context.payload.pull_request;
            if (!pull) {
              core.info("No pull request payload; skipping evals.");
              return "false";
            }

            const labels = new Set((pull.labels ?? []).map((label) => label.name));
            if (labels.has("run-evals")) {
              core.info("run-evals label present; running evals.");
              return "true";
            }

            const evalSensitivePrefixes = [
              "packages/maestro-rs/",
              "packages/tui-rs/",
              "evals/",
            ];
            const evalSensitiveFiles = new Set([
              "package.json",
              "packages/ambient-agent-rs/src/prompt.rs",
              "packages/tui-rs/src/prompts.rs",
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const matched = files.find(({ filename }) =>
              evalSensitiveFiles.has(filename) ||
              evalSensitivePrefixes.some((prefix) => filename.startsWith(prefix))
            );

            if (!matched) {
              core.info("No eval-sensitive files changed and no run-evals label present.");
              return "false";
            }

            core.info(`Running evals because ${matched.filename} changed.`);
            return "true";

  run-evals:
    needs: detect-pr-evals
    if: ${{ needs.detect-pr-evals.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chunkIndex: 1
          - os: ubuntu-latest
            chunkIndex: 2
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (github.event_name == 'pull_request' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || matrix.os) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with: { node-version: 22 }

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: "rustfmt,clippy"

      - name: Validate native agent runtime
        if: ${{ matrix.chunkIndex == 1 }}
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p maestro-tui --all-targets -- -D warnings
          cargo test --locked -p maestro-tui

      - name: Build native scenario runner
        if: ${{ matrix.chunkIndex == 2 }}
        run: cargo build --locked -p maestro

      - name: Run native trajectory and scenario evals
        if: ${{ matrix.chunkIndex == 2 }}
        timeout-minutes: 45
        env:
          MAESTRO_TOOL_EXECUTION_SERVICE_URL: ${{ vars.MAESTRO_TOOL_EXECUTION_SERVICE_URL }}
          MAESTRO_TOOL_EXECUTION_SERVICE_TOKEN: ${{ secrets.MAESTRO_TOOL_EXECUTION_SERVICE_TOKEN }}
          MAESTRO_TOOL_EXECUTION_ORGANIZATION_ID: ${{ vars.MAESTRO_TOOL_EXECUTION_ORGANIZATION_ID }}
          MAESTRO_TOOL_EXECUTION_WORKSPACE_ID: ${{ vars.MAESTRO_TOOL_EXECUTION_WORKSPACE_ID }}
          MAESTRO_TOOL_EXECUTION_SERVICE_TIMEOUT_MS: ${{ vars.MAESTRO_TOOL_EXECUTION_SERVICE_TIMEOUT_MS }}
        run: |
          npm run check:scenario-replay-gate -- --junit-dir tmp/evals
