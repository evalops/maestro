name: evals

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-evals:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-evals') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
            chunkIndex: 1
          - os: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
            chunkIndex: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-nx
        with:
          ensure-ripgrep: "true"

      - name: Install uv
        if: ${{ matrix.chunkIndex == 1 }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install Semgrep CLI
        if: ${{ matrix.chunkIndex == 1 }}
        env:
          UV_HTTP_TIMEOUT: "120"
        run: |
          set -e
          for attempt in 1 2 3; do
            if uv tool install --force "semgrep==1.144.0"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "uv tool install failed after 3 attempts" >&2
              exit 1
            fi
            echo "uv tool install attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Maestro Guardian
        if: ${{ matrix.chunkIndex == 1 }}
        env:
          MAESTRO_GUARDIAN_TOOL_TIMEOUT_MS: "600000"
        run: bash scripts/guardian.sh --all --trigger ci
      - run: npx nx run maestro:build:all
      - run: npx nx run maestro:lint
      - name: Run tests
        timeout-minutes: 25
        run: bunx vitest --run --reporter=verbose --no-file-parallelism --shard=${{ matrix.chunkIndex }}/2
      - name: Run evals chunk
        timeout-minutes: 45
        env:
          MAESTRO_EVAL_CHUNK_COUNT: 2
          MAESTRO_EVAL_CHUNK_INDEX: ${{ matrix.chunkIndex }}
        run: npx nx run maestro:evals
