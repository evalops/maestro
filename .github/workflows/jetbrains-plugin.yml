name: JetBrains Plugin

on:
  push:
    branches: [main]
    paths:
      - "packages/jetbrains-plugin/**"
      - "proto/maestro/v1/headless.proto"
      - ".github/workflows/jetbrains-plugin.yml"
  pull_request:
    paths:
      - "packages/jetbrains-plugin/**"
      - "proto/maestro/v1/headless.proto"
      - ".github/workflows/jetbrains-plugin.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/jetbrains-plugin

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JetBrains plugin
        run: ./gradlew check --no-daemon
