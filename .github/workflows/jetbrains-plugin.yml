name: JetBrains Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/jetbrains-plugin/**"
      - "proto/maestro/v1/headless.proto"
      - ".github/workflows/jetbrains-plugin.yml"
  pull_request:
    paths:
      - "packages/jetbrains-plugin/**"
      - "proto/maestro/v1/headless.proto"
      - ".github/workflows/jetbrains-plugin.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (github.event_name == 'pull_request' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/jetbrains-plugin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Check and build JetBrains plugin
        run: ./gradlew check buildPlugin --no-daemon
