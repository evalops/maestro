name: JetBrains Plugin

on:
  push:
    branches: [main]
    paths:
      - "packages/jetbrains-plugin/**"
      - "proto/maestro/v1/headless.proto"
      - ".github/workflows/jetbrains-plugin.yml"
  pull_request:
    paths:
      - "packages/jetbrains-plugin/**"
      - "proto/maestro/v1/headless.proto"
      - ".github/workflows/jetbrains-plugin.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/jetbrains-plugin

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Check JetBrains plugin
        run: ./gradlew check --no-daemon
