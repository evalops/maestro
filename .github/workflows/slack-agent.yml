name: slack-agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/slack-agent/**"
      - "packages/ai/**"
      - ".github/workflows/slack-agent.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-bun-nx

      - name: Build slack-agent
        run: npx nx run slack-agent:build

      - name: Run slack-agent tests
        run: npx nx run slack-agent:test
