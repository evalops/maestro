name: Hooks Tests
on:
  push:
    branches: [main]
    paths: ["packages/tui-rs/src/hooks/**", ".github/workflows/hooks.yml"]
  pull_request:
permissions: { contents: read }
jobs:
  rust-only-boundary:
    name: Rust-only Source Guard
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "22" }
      - run: test ! -d src/hooks && node scripts/check-rust-only-runtime.mjs

  rust-hooks:
    name: Rust Hook Tests
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
        with: { toolchain: stable, components: rustfmt }
      - run: cargo fmt --all --check
      - run: cargo test --locked -p maestro-tui --test hooks_integration
