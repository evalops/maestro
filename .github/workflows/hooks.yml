name: Hooks Tests
on:
  push:
    branches: [main]
    paths: ["packages/tui-rs/src/hooks/**", ".github/workflows/hooks.yml"]
  pull_request:
permissions: { contents: read }
jobs:
  rust-only-boundary:
    name: Rust-only Source Guard
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with: { node-version: "22" }
      - run: test ! -d src/hooks && node scripts/check-rust-only-runtime.mjs

  rust-hooks:
    name: Rust Hook Tests
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-rust
        with: { toolchain: stable, components: rustfmt }
      - run: cargo fmt --all --check
      - run: cargo test --locked -p maestro-tui --test hooks_integration
