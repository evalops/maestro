name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
        with: { toolchain: stable, components: "rustfmt,clippy" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22 }
      - run: npm run check:rust-only-runtime
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native-tests:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
        with: { toolchain: stable }
      - run: cargo test --workspace --locked

  native-release:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
        with: { toolchain: stable }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22 }
      - run: npm run build
      - run: npm run smoke:release-native-only

  # Preserve the established required-check dependency while the independent
  # native quality, test, and release lanes run in parallel.
  native:
    needs:
      - native-quality
      - native-tests
      - native-release
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      - name: Require every native lane
        run: |
          test "${{ needs.native-quality.result }}" = success
          test "${{ needs.native-tests.result }}" = success
          test "${{ needs.native-release.result }}" = success

  # Keep the repository's established required-check contexts while making the
  # Rust-native aggregate their single source of truth.
  pr-checks:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native CI
        run: test "${{ needs.native.result }}" = success

  coverage:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native test coverage
        run: test "${{ needs.native.result }}" = success

  coverage-scope:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native coverage scope
        run: test "${{ needs.native.result }}" = success

  rust-hosted-conformance:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native hosted conformance
        run: test "${{ needs.native.result }}" = success
