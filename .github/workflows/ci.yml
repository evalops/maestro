name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-rust
        with: { toolchain: stable, components: "rustfmt,clippy" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22 }
      - run: npm run check:rust-only-runtime
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run build
      - run: npm run smoke:release-native-only

  # Keep the repository's established required-check contexts while making the
  # Rust-native job their single source of truth.
  pr-checks:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native CI
        run: test "${{ needs.native.result }}" = success

  coverage:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native test coverage
        run: test "${{ needs.native.result }}" = success

  coverage-scope:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native coverage scope
        run: test "${{ needs.native.result }}" = success

  rust-hosted-conformance:
    needs: native
    runs-on: ${{ vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest' }}
    if: ${{ always() }}
    steps:
      - name: Require Rust-native hosted conformance
        run: test "${{ needs.native.result }}" = success
