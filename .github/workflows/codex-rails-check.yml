name: Codex Rails

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".agents/skills/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/codex-rails-check.yml"

permissions:
  contents: read

jobs:
  validate:
    uses: evalops/.github/.github/workflows/codex-rails-check.yml@7c84584083404b2f9da1b08c20d208db84b70040
    with:
      require_agents: true
