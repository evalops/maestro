name: Codex Rails

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".agents/skills/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/codex-rails-check.yml"

permissions:
  contents: read

jobs:
  validate:
    uses: evalops/.github/.github/workflows/codex-rails-check.yml@ff729846a97fd802242b9e24c738794b7c9b389c
    with:
      require_agents: true
