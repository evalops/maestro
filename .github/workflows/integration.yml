name: integration

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/runtime-gateway-rs/**"
      - "packages/tui-rs/**"
      - "packages/web/dist/**"
      - "docker-compose.yml"
      - ".github/workflows/integration.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEADLESS_PROTOCOL_RUSTFMT: "off"
  SESSION_WIRE_FORMAT_RUSTFMT: "off"

jobs:
  pull-request-path-check:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (github.event_name == 'pull_request' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest')) }}
    outputs:
      integration_paths_changed: ${{ steps.integration_paths.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect integration workflow path changes
        id: integration_paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Generated public mirror PRs re-sync already-integrated internal main.
          if [ "$HEAD_REF" = "sync/public-release-mirror" ]; then
            echo "Generated public mirror PR; skipping integration suite."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed="false"
          while IFS= read -r path; do
            case "$path" in
              packages/runtime-gateway-rs/* | packages/tui-rs/* | packages/web/dist/* | docker-compose.yml | .github/workflows/integration.yml)
                changed="true"
                break
                ;;
            esac
          done < <(git diff --name-only FETCH_HEAD HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  integration-suite:
    needs: pull-request-path-check
    # Keep the expensive service-container suite scoped to integration-relevant
    # changes. The required integration-tests job below always materializes and
    # converts this conditional result into an explicit pass or failure.
    if: ${{ needs.pull-request-path-check.outputs.integration_paths_changed == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (github.event_name == 'pull_request' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 45
    services:
      redis:
        # Pulled via the Docker Hub mirror to avoid docker.io's anonymous-pull
        # rate limit on shared self-hosted runners.
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      postgres:
        # Pulled via the Docker Hub mirror to avoid docker.io's anonymous-pull
        # rate limit on shared self-hosted runners.
        image: mirror.gcr.io/library/postgres:16-alpine
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro
        options: >-
          --health-cmd "pg_isready -U maestro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Run integration tests
        env:
          MAESTRO_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          MAESTRO_DATABASE_URL: postgresql://maestro@localhost:${{ job.services.postgres.ports['5432'] }}/maestro
          PGPASSWORD: maestro
        run: |
          cargo test --locked -p maestro-runtime-gateway

  integration-tests:
    needs: [pull-request-path-check, integration-suite]
    if: ${{ always() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (vars.PUBLIC_PR_VALIDATION_RUNNER || vars.PR_CHECKS_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate required integration gate
        env:
          PATH_CHECK_RESULT: ${{ needs.pull-request-path-check.result }}
          INTEGRATION_PATHS_CHANGED: ${{ needs.pull-request-path-check.outputs.integration_paths_changed }}
          INTEGRATION_SUITE_RESULT: ${{ needs.integration-suite.result }}
        run: node scripts/check-integration-required-gate.mjs

  capability-gated-tests:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-capability-integration') }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id && 'ubuntu-latest' || (github.event_name == 'pull_request' && (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest') || (vars.PUBLIC_PR_VALIDATION_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 45
    services:
      postgres:
        # Pulled via the Docker Hub mirror to avoid docker.io's anonymous-pull
        # rate limit on shared self-hosted runners.
        image: mirror.gcr.io/library/postgres:16-alpine
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro
        options: >-
          --health-cmd "pg_isready -U maestro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install fd when available from apt
        if: ${{ runner.os == 'Linux' }}
        run: |
          # Best-effort: fd-gated tests skip when fd is missing. Do not fail the
          # job on transient apt/network errors (self-hosted runners often block
          # plain HTTP package mirrors on port 80).
          set -uo pipefail
          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [[ -f "$sources" ]]; then
                sudo sed -i \
                  -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
                  -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' \
                  "$sources" || true
              fi
            done
            if sudo apt-get update && sudo apt-get install -y fd-find; then
              if command -v fdfind >/dev/null 2>&1; then
                sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
              fi
            else
              echo "fd apt install failed; fd-gated tests will skip."
            fi
          fi
          if command -v fd >/dev/null 2>&1; then
            fd --version
          else
            echo "fd unavailable; fd-gated tests will skip."
          fi

      - name: Run capability-gated integration tests
        env:
          POSTGRES_DB: maestro
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: maestro
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_USER: maestro
          PGPASSWORD: maestro
        run: |
          cargo test --locked -p maestro-tui --test tools_integration
